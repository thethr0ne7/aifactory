name: Factory validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Factory contracts and registry
        run: |
          node scripts/validate-factory.js
          node scripts/validate-workflow-contract.mjs
          node scripts/validate-autonomous-runtime.js
          node scripts/validate-self-improvement.js
          node scripts/validate-tool-runtime.js
          node scripts/validate-tool-executor-batch.mjs
          node scripts/validate-tool-observability.mjs
          node scripts/validate-reliability-kernel.js
          node scripts/test-reliability-kernel.mjs
          node scripts/test-runtime-truth-gate.mjs
          node scripts/validate-telegram-hq.mjs
          node scripts/validate-telegram-agent-truth.mjs
          node --test evals/runtime/tool-envelope.test.mjs
          node --test evals/runtime/agent-runtime-kernel.test.mjs
          node --test evals/runtime/atomic-agent-sidecar-adapter.test.mjs
