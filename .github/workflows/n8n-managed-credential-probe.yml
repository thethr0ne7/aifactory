name: Probe n8n managed credential
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-n8n-managed-credential.mjs'
      - '.github/workflows/n8n-managed-credential-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N8N_MCP_URL: https://thethr0ne7.app.n8n.cloud/mcp-server/http
      N8N_MCP_TOKEN: ${{ secrets.N8N_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe managed credential and auto-revert if invalid
        run: node scripts/probe-n8n-managed-credential.mjs
