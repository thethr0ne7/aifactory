name: Activate n8n agent network

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'registry/agent-network.json'
      - 'scripts/activate-n8n-agent-network.mjs'
      - 'scripts/configure-supervisor-fast-model.mjs'
      - 'scripts/repair-n8n-subagent-graph.mjs'
      - '.github/workflows/repair-n8n-subagent-graph.yml'
  pull_request:
    branches: [main]
    paths:
      - 'registry/agent-network.json'
      - 'scripts/activate-n8n-agent-network.mjs'
      - 'scripts/configure-supervisor-fast-model.mjs'
      - 'scripts/repair-n8n-subagent-graph.mjs'
      - '.github/workflows/repair-n8n-subagent-graph.yml'

permissions:
  contents: read

concurrency:
  group: n8n-agent-network-activation
  cancel-in-progress: false

jobs:
  activate-native-graph:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      N8N_MCP_URL: https://thethr0ne7.app.n8n.cloud/mcp-server/http
      N8N_MCP_TOKEN: ${{ secrets.N8N_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Put Supervisor on the lower-latency operational model pool
        run: node scripts/configure-supervisor-fast-model.mjs
      - name: Publish internal agents and persist native sub-agent graph
        run: node scripts/activate-n8n-agent-network.mjs
      - name: Upload sanitized graph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-agent-network-activation
          path: |
            artifacts/n8n-agent-network-activation.json
            artifacts/supervisor-fast-model.json
          if-no-files-found: ignore
          retention-days: 14
