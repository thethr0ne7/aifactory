name: Activate Handoff Coordinator G3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/activate-handoff-coordinator-g3.mjs'
      - '.github/workflows/activate-handoff-coordinator-g3.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: ai-factory-g3-native-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      N8N_MCP_URL: https://thethr0ne7.app.n8n.cloud/mcp-server/http
      N8N_MCP_TOKEN: ${{ secrets.N8N_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish G3 internally and attach it to four G1 sponsors
        run: node scripts/activate-handoff-coordinator-g3.mjs
      - name: Mark G3 native activation healthy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"ai-factory/g3-native-activation","description":"Handoff Coordinator G3 published internally and attached to 4 G1 sponsors"}'
      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-coordinator-g3-activation
          path: artifacts/handoff-coordinator-g3-activation.json
          if-no-files-found: ignore
          retention-days: 14
