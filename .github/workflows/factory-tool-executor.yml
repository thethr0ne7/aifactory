name: AI Factory tool executor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'registry/tool-runtime.json'
      - 'runtime/tool-runtime.mjs'
      - 'scripts/tool-executor.mjs'
      - 'scripts/record-workflow-failure.mjs'
      - 'scripts/test-tool-runtime.mjs'
      - 'scripts/validate-tool-runtime.js'
      - 'supabase/functions/ai-factory-broker/**'
      - 'supabase/functions/ai-factory-fault-sink/**'
      - 'infra/supabase/migrations/**'
      - '.github/workflows/factory-tool-executor.yml'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ai-factory-tool-executor
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FACTORY_BROKER_URL: https://hgivyjjethjwswjrvroy.supabase.co/functions/v1/ai-factory-broker
      FACTORY_FAULT_SINK_URL: https://hgivyjjethjwswjrvroy.supabase.co/functions/v1/ai-factory-fault-sink
      FACTORY_TOOL_BATCH_SIZE: '6'
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate controlled tool runtime
        run: node scripts/validate-tool-runtime.js

      - name: Execute bounded allowlisted tool batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/tool-executor.mjs

      - name: Persist workflow failure to Factory memory
        if: failure()
        env:
          FACTORY_FAILURE_SCOPE: tool-executor
          FACTORY_FAILURE_SUMMARY: AI Factory controlled tool executor workflow failed; preserve the failure and repair the deterministic boundary before repeating the tool operation.
        run: node scripts/record-workflow-failure.mjs
