name: Visible Agent Organization

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'registry/agent-organization.json'
      - 'scripts/agent-organization-worker.mjs'
      - 'scripts/validate-agent-organization.mjs'
      - 'infra/supabase/migrations/20260820_343_visible_agent_organization.sql'
      - 'infra/supabase/migrations/20260829_360_agent_hot_runtime.sql'
      - 'infra/supabase/migrations/20260829_361_agent_provider_failover.sql'
      - 'supabase/functions/ai-factory-agent-org/**'
      - 'supabase/functions/ai-factory-agent-hot-worker/**'
      - 'supabase/functions/ai-factory-runtime-bootstrap/**'
      - 'supabase/functions/ai-factory-telegram-hq/**'
      - '.github/workflows/agent-organization.yml'
  pull_request:
    branches: [main]
    paths:
      - 'registry/agent-organization.json'
      - 'scripts/agent-organization-worker.mjs'
      - 'scripts/validate-agent-organization.mjs'
      - 'infra/supabase/migrations/20260820_343_visible_agent_organization.sql'
      - 'infra/supabase/migrations/20260829_360_agent_hot_runtime.sql'
      - 'infra/supabase/migrations/20260829_361_agent_provider_failover.sql'
      - 'supabase/functions/ai-factory-agent-org/**'
      - 'supabase/functions/ai-factory-agent-hot-worker/**'
      - 'supabase/functions/ai-factory-runtime-bootstrap/**'
      - 'supabase/functions/ai-factory-telegram-hq/**'
      - '.github/workflows/agent-organization.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-factory-visible-agent-organization
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate visible-agent organization contracts
        run: node scripts/validate-agent-organization.mjs

  execute:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      N8N_MCP_URL: https://thethr0ne7.app.n8n.cloud/mcp-server/http
      N8N_MCP_TOKEN: ${{ secrets.N8N_MCP_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      N8N_PROJECT_ID: FP3HOvN6NpEDN0PB
      FACTORY_AGENT_ORG_BROKER_URL: https://hgivyjjethjwswjrvroy.supabase.co/functions/v1/ai-factory-agent-org
      FACTORY_TELEGRAM_HQ_URL: https://hgivyjjethjwswjrvroy.supabase.co/functions/v1/ai-factory-telegram-hq
      FACTORY_RUNTIME_BOOTSTRAP_URL: https://hgivyjjethjwswjrvroy.supabase.co/functions/v1/ai-factory-runtime-bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync runtime credentials into Supabase Vault
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${N8N_MCP_TOKEN:-}" ] && [ -z "${GROQ_API_KEY:-}" ]; then
            echo "No hot-runtime credential is configured" >&2
            exit 1
          fi
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aifactory-hot-runtime-bootstrap"
          oidc="$(curl --fail-with-body -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value')"
          test -n "$oidc" && test "$oidc" != "null"
          payload="$(jq -cn --arg n8n "${N8N_MCP_TOKEN:-}" --arg groq "${GROQ_API_KEY:-}" '{n8n_mcp_token:$n8n,groq_api_key:$groq}')"
          response="$(curl --fail-with-body -sS -X POST "$FACTORY_RUNTIME_BOOTSTRAP_URL" \
            -H "Authorization: Bearer $oidc" \
            -H "Content-Type: application/json" \
            --data-binary "$payload")"
          echo "$response" | jq -e '.ok == true' >/dev/null
          if echo "$response" | jq -e '.stored | index("groq_api_key") != null' >/dev/null; then
            echo "HOT_RUNTIME_DIRECT_PROVIDER_READY"
          else
            echo "HOT_RUNTIME_DIRECT_PROVIDER_NOT_CONFIGURED"
          fi
      - name: Run bounded visible-agent fallback/recovery turn
        continue-on-error: true
        run: node scripts/agent-organization-worker.mjs
