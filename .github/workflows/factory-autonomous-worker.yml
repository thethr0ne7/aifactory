name: AI Factory autonomous worker

on:
  workflow_dispatch:
    inputs:
      objective:
        description: Optional task objective to enqueue before worker claim
        required: false
        type: string
      kind:
        description: Task kind
        required: false
        default: general
        type: string
      autonomy_level:
        description: Runtime autonomy level
        required: false
        default: A3
        type: choice
        options: [A0, A1, A2, A3, A4, A5, A6, A7]
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - 'WORKFLOW.md'
      - 'runtime/**'
      - 'registry/**'
      - 'skills/**'
      - 'evals/runtime/**'
      - 'scripts/copilot-autonomous-worker-v2.mjs'
      - 'scripts/copilot-autonomous-worker-v3.mjs'
      - 'scripts/telegram-hq-delivery-sweep.mjs'
      - 'scripts/validate-workflow-contract.mjs'
      - 'scripts/validate-tool-observability.mjs'
      - 'scripts/test-runtime-truth-gate.mjs'
      - 'scripts/validate-telegram-hq.mjs'
      - 'scripts/validate-telegram-agent-truth.mjs'
      - 'scripts/validate-agent-nursery-intelligence.mjs'
      - 'scripts/record-workflow-failure.mjs'
      - 'scripts/test-reliability-kernel.mjs'
      - 'supabase/functions/ai-factory-critical-memory/**'
      - 'supabase/functions/ai-factory-fault-sink/**'
      - 'supabase/functions/ai-factory-broker/**'
      - 'supabase/functions/ai-factory-telegram-hq/**'
      - 'infra/supabase/migrations/**'
      - '.github/workflows/factory-autonomous-worker.yml'

permissions:
  contents: read
  id-token: write
  copilot-requests: write

concurrency:
  group: ai-factory-autonomous-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FACTORY_BROKER_URL: https://hgivyjjethjwswjrvroy.supabase.co/functions/v1/ai-factory-broker
      FACTORY_CRITICAL_MEMORY_URL: https://hgivyjjethjwswjrvroy.supabase.co/functions/v1/ai-factory-critical-memory
      FACTORY_FAULT_SINK_URL: https://hgivyjjethjwswjrvroy.supabase.co/functions/v1/ai-factory-fault-sink
      FACTORY_TELEGRAM_HQ_URL: https://hgivyjjethjwswjrvroy.supabase.co/functions/v1/ai-factory-telegram-hq
      FACTORY_OBJECTIVE: ${{ inputs.objective || '' }}
      FACTORY_KIND: ${{ inputs.kind || 'general' }}
      FACTORY_AUTONOMY_LEVEL: ${{ inputs.autonomy_level || 'A3' }}
      FACTORY_DAILY_SELF_AUDIT: ${{ github.event_name == 'schedule' && github.event.schedule == '17 2 * * *' }}
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Validate factory contracts and reliability kernel
        if: github.event_name != 'schedule' || github.event.schedule == '17 2 * * *'
        run: |
          node scripts/validate-factory.js
          node scripts/validate-workflow-contract.mjs
          node scripts/validate-autonomous-runtime.js
          node scripts/validate-tool-observability.mjs
          node scripts/validate-reliability-kernel.js
          node scripts/test-reliability-kernel.mjs
          node scripts/test-runtime-truth-gate.mjs
          node scripts/validate-telegram-hq.mjs
          node scripts/validate-telegram-agent-truth.mjs
          node scripts/validate-agent-nursery-intelligence.mjs
          node --test evals/runtime/tool-envelope.test.mjs
          node --test evals/runtime/agent-nursery-intelligence.test.mjs

      - name: Run autonomous worker v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/copilot-autonomous-worker-v3.mjs

      - name: Deliver completed Telegram HQ runs
        if: always() && !cancelled()
        continue-on-error: true
        run: node scripts/telegram-hq-delivery-sweep.mjs

      - name: Persist workflow failure to Factory memory
        if: failure()
        env:
          FACTORY_FAILURE_SCOPE: autonomous-worker
          FACTORY_FAILURE_SUMMARY: AI Factory autonomous worker workflow failed; inspect the linked Actions run and reconcile the failure before repeating it.
        run: node scripts/record-workflow-failure.mjs
